{% extends "base.html" %}

{% block title %}Sign Up - FoodFlow{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto my-8">
    <div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-200">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-black text-slate-900">Create New Account</h1>
            <p class="text-slate-500 text-sm mt-1">Join FoodFlow as a customer, restaurant partner, or rider</p>
        </div>

        <form method="POST" action="{{ url_for('auth.register') }}" class="space-y-4">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label for="full_name" class="block text-sm font-semibold text-slate-700 mb-1">Full Name *</label>
                    <input type="text" id="full_name" name="full_name" required
                           class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-primary text-sm"
                           placeholder="e.g. John Doe">
                </div>
                <div>
                    <label for="username" class="block text-sm font-semibold text-slate-700 mb-1">Username *</label>
                    <input type="text" id="username" name="username" required
                           class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-primary text-sm"
                           placeholder="e.g. johndoe123">
                </div>
            </div>

            <div>
                <label for="email" class="block text-sm font-semibold text-slate-700 mb-1">Email Address *</label>
                <input type="email" id="email" name="email" required
                       class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-primary text-sm"
                       placeholder="you@example.com">
            </div>

            <div>
                <label for="role" class="block text-sm font-semibold text-slate-700 mb-1">Select Account Type *</label>
                <select id="role" name="role" required
                        class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-primary text-sm bg-white">
                    <option value="customer">Customer (Order delicious meals)</option>
                    <option value="restaurant_owner">Restaurant Owner (Manage menu & kitchen)</option>
                    <option value="rider">Delivery Rider (Pick up and deliver orders)</option>
                </select>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label for="phone" class="block text-sm font-semibold text-slate-700 mb-1">Phone Number</label>
                    <input type="tel" id="phone" name="phone"
                           class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-primary text-sm"
                           placeholder="+8801700000000">
                </div>
                <div>
                    <label for="address" class="block text-sm font-semibold text-slate-700 mb-1">Address / Location</label>
                    <input type="text" id="address" name="address"
                           class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-primary text-sm"
                           placeholder="e.g. Talaimari, Rajshahi">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label for="password" class="block text-sm font-semibold text-slate-700 mb-1">Password *</label>
                    <input type="password" id="password" name="password" required minlength="6"
                           class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-primary text-sm"
                           placeholder="••••••••">
                </div>
                <div>
                    <label for="confirm_password" class="block text-sm font-semibold text-slate-700 mb-1">Confirm Password *</label>
                    <input type="password" id="confirm_password" name="confirm_password" required minlength="6"
                           class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-primary text-sm"
                           placeholder="••••••••">
                </div>
            </div>

            <button type="submit" 
                    class="w-full py-3 px-4 bg-primary hover:bg-primary-dark text-white font-bold rounded-xl shadow-md hover:shadow-lg transition flex items-center justify-center gap-2 mt-4">
                <span>Create Account</span>
                <i class="fa-solid fa-user-plus"></i>
            </button>
        </form>

        <p class="text-center text-sm text-slate-600 mt-6">
            Already have an account? 
            <a href="{{ url_for('auth.login') }}" class="font-bold text-primary hover:underline">Log in</a>
        </p>
    </div>
</div>
{% endblock %}
