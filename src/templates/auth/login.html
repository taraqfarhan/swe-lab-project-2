{% extends "base.html" %}

{% block title %}Log In - FoodFlow{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-8">
    <div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-200">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-black text-slate-900">Welcome Back</h1>
            <p class="text-slate-500 text-sm mt-1">Sign in to access your FoodFlow account</p>
        </div>

        <!-- Quick Demo Switcher Buttons -->
        <div class="mb-6 p-3 bg-slate-50 rounded-xl border border-slate-200">
            <p class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2 flex items-center gap-1.5">
                <i class="fa-solid fa-bolt text-amber-500"></i> Quick Demo Logins:
            </p>
            <div class="grid grid-cols-2 gap-2 text-xs">
                <button type="button" onclick="fillDemoAccount('john_doe', 'password123')" class="p-2 text-left bg-white border border-slate-200 rounded-lg hover:border-primary hover:text-primary transition flex items-center gap-1.5">
                    <i class="fa-solid fa-user text-blue-500"></i> Customer
                </button>
                <button type="button" onclick="fillDemoAccount('chef_mario', 'password123')" class="p-2 text-left bg-white border border-slate-200 rounded-lg hover:border-primary hover:text-primary transition flex items-center gap-1.5">
                    <i class="fa-solid fa-fire text-amber-500"></i> Rest. Owner
                </button>
                <button type="button" onclick="fillDemoAccount('rider_alex', 'password123')" class="p-2 text-left bg-white border border-slate-200 rounded-lg hover:border-primary hover:text-primary transition flex items-center gap-1.5">
                    <i class="fa-solid fa-motorcycle text-emerald-500"></i> Rider
                </button>
                <button type="button" onclick="fillDemoAccount('admin', 'password123')" class="p-2 text-left bg-white border border-slate-200 rounded-lg hover:border-primary hover:text-primary transition flex items-center gap-1.5">
                    <i class="fa-solid fa-shield text-purple-500"></i> Admin
                </button>
            </div>
        </div>

        <form method="POST" action="{{ url_for('auth.login') }}" class="space-y-4">
            <div>
                <label for="username" class="block text-sm font-semibold text-slate-700 mb-1">Username or Email</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                        <i class="fa-solid fa-user"></i>
                    </span>
                    <input type="text" id="username" name="username" required
                           class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent text-sm transition"
                           placeholder="e.g. john_doe or admin">
                </div>
            </div>

            <div>
                <label for="password" class="block text-sm font-semibold text-slate-700 mb-1">Password</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                        <i class="fa-solid fa-lock"></i>
                    </span>
                    <input type="password" id="password" name="password" required
                           class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent text-sm transition"
                           placeholder="••••••••">
                </div>
            </div>

            <button type="submit" 
                    class="w-full py-3 px-4 bg-primary hover:bg-primary-dark text-white font-bold rounded-xl shadow-md hover:shadow-lg transition flex items-center justify-center gap-2">
                <span>Sign In</span>
                <i class="fa-solid fa-arrow-right"></i>
            </button>
        </form>

        <p class="text-center text-sm text-slate-600 mt-6">
            Don't have an account? 
            <a href="{{ url_for('auth.register') }}" class="font-bold text-primary hover:underline">Create account</a>
        </p>
    </div>
</div>
{% endblock %}
